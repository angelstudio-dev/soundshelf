services:
  soundshelf:
    build: .
    image: soundshelf:latest
    container_name: soundshelf
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_PATH: /app/data/soundshelf.sqlite
      DEMO_MODE: ${DEMO_MODE:-false}
      ABS_BASE_URL: ${ABS_BASE_URL:-}
      ABS_TOKEN: ${ABS_TOKEN:-}
      PLEX_BASE_URL: ${PLEX_BASE_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_LIBRARY_TITLE: ${PLEX_LIBRARY_TITLE:-Audiobooks}
      LOCAL_LIBRARY_PATHS: ${LOCAL_LIBRARY_PATHS:-/media/books}
    volumes:
      - ./data:/app/data
      - /volume1/books:/media/books:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
